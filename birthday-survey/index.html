<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>김수진님 비밀 정답지 | 매형 생일 퀴즈</title>
<style>
:root{--bg:#fffaf4;--card:#fff;--ink:#2b2118;--muted:#7b6f64;--line:#eadfd4;--accent:#ff7a59;--soft:#fff0e7}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:linear-gradient(#fff7ed,#fffaf4 220px);color:var(--ink)}
.wrap{max-width:820px;margin:auto;padding:24px 16px 70px}.badge{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--muted);font-size:13px}
h1{font-size:clamp(28px,6vw,44px);line-height:1.15;margin:18px 0 10px}.lead{color:var(--muted);line-height:1.7}.note{background:#fff3d7;border:1px solid #f4d99b;border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.6;margin-top:16px}
.sticky{position:sticky;top:0;background:rgba(255,250,244,.94);backdrop-filter:blur(10px);padding:12px 0;z-index:3}.row{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:7px}.bar{height:9px;background:#efe4d9;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#ff7a59,#f7b955)}
section{margin-top:22px}.head{display:flex;justify-content:space-between;gap:10px;align-items:end;margin:0 2px 10px}.head h2{margin:0;font-size:21px}.head span{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}.qt{display:flex;gap:10px}.num{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;border-radius:10px;background:var(--soft);font-weight:800;color:#b8462a}.q{font-weight:700;line-height:1.55;padding-top:5px}.hint{margin:7px 0 0 44px;color:var(--muted);font-size:12px;line-height:1.5}
input{width:100%;margin-top:13px;border:1.5px solid #d9cdc2;border-radius:13px;padding:13px 14px;font:inherit;font-size:16px;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,122,89,.11)}
.actions,.mini{display:flex;flex-wrap:wrap;gap:9px;margin-top:24px}.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:800;font-size:15px;min-height:48px;cursor:pointer}.primary{background:var(--ink);color:#fff;flex:1 1 220px}.secondary{background:#fff;border:1px solid var(--line)}.danger{background:#fff1f1;color:#9e2d2d;border:1px solid #f2cccc}
.result{display:none;margin-top:24px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}.result.show{display:block}.result textarea{width:100%;min-height:280px;border:1px solid var(--line);border-radius:13px;padding:13px;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace}.toast{color:#177245;font-size:13px;font-weight:700;min-height:22px;margin-top:8px}.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:28px;line-height:1.7}
@media(max-width:520px){.wrap{padding-left:13px;padding-right:13px}.head{align-items:flex-start;flex-direction:column}.btn{width:100%}}
</style>
</head>
<body>
<main class="wrap">
<div class="badge">🎂 매형 생일 이벤트 · 누님 비밀 설문</div>
<h1>김수진님 비밀 정답지 🤫</h1>
<p class="lead">매형에게 낼 ‘누나 맞히기’ 퀴즈의 정답을 만드는 설문이에요.<br>평소의 나를 기준으로 편하게 답해주세요. 정답은 형님에게 비밀!</p>
<div class="note">🔒 <b>답변은 서버로 전송되지 않습니다.</b> 이 기기 브라우저에만 임시 저장돼요. 마지막에 <b>정답지 파일(.txt)</b>을 저장해서 호진에게 보내주세요.</div>
<div class="sticky"><div class="row"><span>작성 진행률</span><b id="pt">0 / 40</b></div><div class="bar"><div class="fill" id="pb"></div></div></div>
<form id="form"><div id="qs"></div>
<div class="actions"><button class="btn primary" type="button" id="make">🎁 정답지 만들기</button><button class="btn secondary" type="button" id="save">임시저장</button><button class="btn danger" type="button" id="reset">전체 초기화</button></div>
</form>
<section class="result" id="result"><h2>완성된 정답지</h2><p class="lead">아래 정답지를 저장해 호진에게 보내면 돼요. 문제지만 따로 저장할 수도 있어요.</p><textarea id="out" readonly></textarea><div class="mini"><button class="btn primary" type="button" id="downA">정답지 파일 저장</button><button class="btn secondary" type="button" id="copy">정답지 복사</button><button class="btn secondary" type="button" id="downQ">문제지만 저장</button></div><div class="toast" id="toast"></div></section>
<div class="foot">생일퀴즈 준비용 · 입력 내용은 자동 전송되지 않습니다.</div>
</main>
<script>
const groups=[
["① 취향 & 기본편","가볍게 시작하는 문제",[
["누나가 가장 좋아하는 음식은?","예: 회, 삼겹살, 떡볶이처럼 구체적으로"],
["누나가 가장 싫어하거나 잘 안 먹는 음식은?","하나만 골라도 좋아요"],
["카페에 가면 가장 자주 시키는 음료는?","예: 아이스 아메리카노, 바닐라라떼"],
["치킨을 먹는다면 가장 좋아하는 맛은?","후라이드 / 양념 / 간장 / 매운맛 등"],
["갑자기 하루 쉬는 날이 생기면 가장 하고 싶은 것은?","집에서 쉬기 / 드라이브 / 쇼핑 / 맛집 등"],
["여행 가면 가장 중요하게 생각하는 것은?","맛집 / 숙소 / 관광 / 사진 / 쇼핑 등"],
["여행 스타일은 계획형에 가까울까, 즉흥형에 가까울까?","중간이라면 실제 스타일을 적어주세요"],
["가장 좋아하는 계절은?","봄 / 여름 / 가을 / 겨울"],
["가장 싫어하는 날씨는?","비 / 더위 / 추위 / 바람 등"],
["돈을 써도 가장 아깝지 않다고 느끼는 분야는?","음식 / 여행 / 옷 / 화장품 / 취미 등"]
]],
["② 생활 습관편","평소 잘 관찰했는지 확인",[
["아침에 일어나서 가장 먼저 하는 행동은?","정말 평소 기준으로!"],
["잘 때 가장 자주 하는 습관은?","옆으로 자기 / 이불 걷어차기 / 코골이(?) 등"],
["집에서 가장 오래 머무는 장소는?","침대 / 소파 / 식탁 / 화장대 등"],
["스트레스 받을 때 가장 먼저 하는 행동은?","먹기 / 잠 / 이야기 / 혼자 있기 / 쇼핑 등"],
["집에서 가장 자주 잃어버리는 물건은?","휴대폰 / 리모컨 / 카드 / 립밤 / 머리끈 등"],
["화났을 때 제일 먼저 나타나는 행동은?","말수가 줄어든다 / 한숨 / 말이 많아진다 등"],
["사진을 찍으면 가장 먼저 확인하는 곳은?","얼굴 / 머리 / 몸 / 배경 / 매형 표정"],
["사진을 보통 몇 장쯤 찍어야 ‘됐다’고 느껴?","숫자나 범위로 써도 좋아요"],
["냉장고 문을 열고 가장 자주 하는 말은?","실제로 자주 하는 말이 있다면 그대로"],
["매형에게 가장 자주 하는 부탁은?","이것 좀 가져다줘 / 같이 가줘 / 이것 좀 봐줘 등"]
]],
["③ 부부 & 상황편","둘이라서 알 수 있는 문제",[
["선물 받을 때 더 좋은 것은? 갖고 싶던 물건 vs 예상 못 한 깜짝선물","둘 중 하나 또는 다른 답"],
["기분이 안 좋을 때 매형이 해주면 가장 좋은 행동은?","들어주기 / 맛있는 거 / 안아주기 / 드라이브 등"],
["매형에게 가장 자주 하는 말은?","실제 말투면 더 재밌어요"],
["지금 당장 여행을 갈 수 있다면 가장 가고 싶은 곳은?","나라·도시·장소 모두 가능"],
["매형에게 생일날 가장 듣고 싶은 말은?","훈훈한 마지막 문제 후보"],
["하루 동안 매형에게 딱 하나 금지시킬 수 있다면?","술 / 게임 / 휴대폰 / 늦잠 / 기타"],
["100만원짜리 물건을 사고 싶다면 매형에게 어떻게 말할 것 같아?","실제 말투로 적으면 더 웃겨요"],
["매형의 습관 중 딱 하나만 바꿀 수 있다면 무엇?","웃으며 공개 가능한 정도로"],
["피곤한 날 매형에게 가장 원하는 것은?","조용히 있기 / 안마 / 맛있는 거 / 이야기 등"],
["로또 10억에 당첨되면 매형에게 언제 말할 것 같아?","바로 / 확인 후 / 하루 뒤 등"]
]],
["④ 빵 터지는 보너스편","정답 공개할 때가 핵심 😂",[
["‘아무거나 먹자’라고 말했을 때 실제 뜻은?","진짜 아무거나? 몇 개 추천해봐? 이미 먹고 싶은 게 있음?"],
["‘괜찮아’라고 말했을 때 실제로 괜찮을 확률은 몇 %?","0~100% 중 느낌대로 😂"],
["옷 입고 ‘나 어때?’라고 물으면 가장 듣고 싶은 대답은?","예뻐 / 오늘 더 예뻐 / 그 옷 찰떡 등"],
["마트에 ‘이것만 사러 가자’ 하고 들어가면 실제로 얼마나 사올까?","진짜 1개 / 3~5개 / 장바구니 한가득"],
["매형 몰래 간식을 숨긴다면 어디에 숨길까?","안 숨긴다면 ‘안 숨김’도 정답"],
["하루 동안 매형과 몸이 바뀐다면 제일 먼저 할 행동은?","상상력 문제 😂"],
["배달 메뉴를 고르는 데 평균 얼마나 걸릴까?","5분 / 15분 / 30분 이상 등"],
["집에서 가장 자주 하는 혼잣말 또는 감탄사는?","실제 표현 그대로 적으면 좋아요"],
["매형이 생각하는 것보다 내가 더 좋아하는 것은 무엇일까?","음식, 취미, 행동, 장소 뭐든 가능"],
["매형이 이 문제를 틀리면 가장 억울할 것 같은 ‘이건 꼭 알아야지!’ 한 가지는?","마지막 히든 문제용 ⭐"]
]]];
const all=groups.flatMap(g=>g[2]), root=document.getElementById("qs"), inputs=[];
let no=0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
groups.forEach(g=>{const s=document.createElement("section");s.innerHTML='<div class="head"><h2>'+g[0]+'</h2><span>'+g[1]+'</span></div>';g[2].forEach(x=>{no++;const d=document.createElement("div");d.className="card";d.innerHTML='<div class="qt"><div class="num">'+no+'</div><div class="q">'+esc(x[0])+'</div></div><div class="hint">'+esc(x[1])+'</div><input id="q'+no+'" placeholder="누님의 정답을 적어주세요" aria-label="'+esc(x[0])+'">';s.appendChild(d)});root.appendChild(s)});
document.querySelectorAll("input").forEach(x=>inputs.push(x));
const key="sujinBirthdayQuizV1",pt=document.getElementById("pt"),pb=document.getElementById("pb"),toast=document.getElementById("toast");
function prog(){let n=inputs.filter(x=>x.value.trim()).length;pt.textContent=n+" / "+inputs.length;pb.style.width=(n/inputs.length*100)+"%"}
function save(msg){let d={};inputs.forEach(x=>d[x.id]=x.value);localStorage.setItem(key,JSON.stringify(d));if(msg){toast.textContent="임시저장했어요 ✓";setTimeout(()=>toast.textContent="",1800)}}
function load(){try{let d=JSON.parse(localStorage.getItem(key)||"{}");inputs.forEach(x=>{if(typeof d[x.id]==="string")x.value=d[x.id]})}catch(e){}prog()}
let t;inputs.forEach(x=>x.addEventListener("input",()=>{prog();clearTimeout(t);t=setTimeout(()=>save(false),350)}));
function rows(){return all.map((x,i)=>({n:i+1,q:x[0],a:document.getElementById("q"+(i+1)).value.trim()})).filter(x=>x.a)}
function aText(){let r=rows();return "🎂 매형 생일퀴즈 — 김수진 누님 비밀 정답지\n작성 문항: "+r.length+"개\n\n"+r.map(x=>x.n+". "+x.q+"\n정답: "+x.a).join("\n\n")}
function qText(){let r=rows();return "🎤 매형 생일퀴즈 — 진행자용 문제지\n총 "+r.length+"문제\n\n"+r.map((x,i)=>(i+1)+". "+x.q).join("\n\n")}
function down(name,text){let b=new Blob([text],{type:"text/plain;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.getElementById("make").onclick=()=>{save(false);if(!rows().length)return alert("한 문제 이상 답해주세요 🙂");document.getElementById("out").value=aText();document.getElementById("result").classList.add("show");document.getElementById("result").scrollIntoView({behavior:"smooth"})};
document.getElementById("save").onclick=()=>save(true);
document.getElementById("reset").onclick=()=>{if(confirm("작성한 답을 전부 지울까요?")){inputs.forEach(x=>x.value="");localStorage.removeItem(key);prog();document.getElementById("result").classList.remove("show")}};
document.getElementById("downA").onclick=()=>down("김수진_매형생일퀴즈_정답지.txt",aText());
document.getElementById("downQ").onclick=()=>down("매형생일퀴즈_문제지.txt",qText());
document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText(aText());toast.textContent="정답지를 복사했어요 ✓"}catch(e){document.getElementById("out").select();toast.textContent="선택했어요. 복사해 주세요."}};
load();
</script>
</body></html>
